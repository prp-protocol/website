<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 z" fill="#111"/>
    </marker>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 700; fill: #111; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 17px; fill: #444; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 19px; font-weight: 700; fill: #111; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 15px; fill: #333; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 13px; fill: #555; }
      .box { fill: #fff; stroke: #111; stroke-width: 1.6; rx: 10; }
      .softbox { fill: #f7f7f7; stroke: #111; stroke-width: 1.2; rx: 10; }
      .core { fill: #eeeeee; stroke: #111; stroke-width: 2.2; rx: 12; }
      .dashed { fill: none; stroke: #666; stroke-width: 1.2; stroke-dasharray: 6 5; rx: 14; }
      .line { stroke: #111; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .thin { stroke: #777; stroke-width: 1.2; fill: none; marker-end: url(#arrow); }
      .divider { stroke: #bbb; stroke-width: 1.2; }
    </style>
  </defs>

  <rect width="1400" height="850" fill="white"/>

  <text x="350" y="55" text-anchor="middle" class="title">Address-Centric Communication</text>
  <text x="1050" y="55" text-anchor="middle" class="title">Relationship-Centric Communication</text>

  <text x="350" y="86" text-anchor="middle" class="subtitle">Communication emerges from locating a routable object</text>
  <text x="1050" y="86" text-anchor="middle" class="subtitle">Communication emerges from a pre-existing relationship</text>

  <line x1="700" y1="35" x2="700" y2="805" class="divider"/>

  <rect x="190" y="125" width="320" height="70" class="core"/>
  <text x="350" y="154" text-anchor="middle" class="label">Address</text>
  <text x="350" y="177" text-anchor="middle" class="small">primary communication object</text>

  <line x1="350" y1="195" x2="350" y2="245" class="line"/>

  <rect x="190" y="250" width="320" height="70" class="box"/>
  <text x="350" y="279" text-anchor="middle" class="label">Route</text>
  <text x="350" y="302" text-anchor="middle" class="small">path selected to reach address</text>

  <line x1="350" y1="320" x2="350" y2="370" class="line"/>

  <rect x="190" y="375" width="320" height="70" class="box"/>
  <text x="350" y="404" text-anchor="middle" class="label">Transport</text>
  <text x="350" y="427" text-anchor="middle" class="small">session between reachable endpoints</text>

  <line x1="350" y1="445" x2="350" y2="495" class="line"/>

  <rect x="190" y="500" width="320" height="70" class="box"/>
  <text x="350" y="529" text-anchor="middle" class="label">Communication</text>
  <text x="350" y="552" text-anchor="middle" class="small">realized after endpoint reachability</text>

  <rect x="105" y="625" width="490" height="120" class="dashed"/>
  <text x="350" y="653" text-anchor="middle" class="label">Coupled concerns</text>
  <text x="350" y="684" text-anchor="middle" class="small">identity ↔ address</text>
  <text x="350" y="708" text-anchor="middle" class="small">mobility ↔ routing</text>
  <text x="350" y="732" text-anchor="middle" class="small">governance ↔ allocation</text>

  <rect x="890" y="125" width="320" height="78" class="core"/>
  <text x="1050" y="154" text-anchor="middle" class="label">Relationship</text>
  <text x="1050" y="178" text-anchor="middle" class="small">primary communication object</text>
  <text x="1050" y="195" text-anchor="middle" class="tiny">permissions, trust material, policy</text>

  <line x1="1050" y1="203" x2="1050" y2="253" class="line"/>

  <rect x="890" y="258" width="320" height="78" class="core"/>
  <text x="1050" y="287" text-anchor="middle" class="label">Continuity</text>
  <text x="1050" y="311" text-anchor="middle" class="small">persistent relationship context</text>
  <text x="1050" y="328" text-anchor="middle" class="tiny">anonymous, pseudonymous, authenticated</text>

  <line x1="1050" y1="336" x2="1050" y2="392" class="line"/>

  <text x="1050" y="385" text-anchor="middle" class="small">realized through replaceable mechanisms</text>

  <rect x="780" y="425" width="170" height="70" class="softbox"/>
  <text x="865" y="454" text-anchor="middle" class="label">Route</text>
  <text x="865" y="477" text-anchor="middle" class="tiny">trajectory</text>

  <rect x="965" y="425" width="170" height="70" class="softbox"/>
  <text x="1050" y="454" text-anchor="middle" class="label">Transport</text>
  <text x="1050" y="477" text-anchor="middle" class="tiny">authenticated exchange</text>

  <rect x="1150" y="425" width="170" height="70" class="softbox"/>
  <text x="1235" y="454" text-anchor="middle" class="label">Carrier</text>
  <text x="1235" y="477" text-anchor="middle" class="tiny">data movement</text>

  <path d="M1050 392 C990 410 930 415 865 425" class="thin"/>
  <path d="M1050 392 L1050 425" class="thin"/>
  <path d="M1050 392 C1110 410 1170 415 1235 425" class="thin"/>

  <rect x="805" y="545" width="490" height="132" class="dashed"/>
  <text x="1050" y="573" text-anchor="middle" class="label">Decoupled concerns</text>
  <text x="1050" y="604" text-anchor="middle" class="small">identity becomes a relationship policy</text>
  <text x="1050" y="628" text-anchor="middle" class="small">routing becomes a realization mechanism</text>
  <text x="1050" y="652" text-anchor="middle" class="small">governance becomes an optional service</text>

  <rect x="805" y="715" width="490" height="58" class="softbox"/>
  <text x="1050" y="739" text-anchor="middle" class="label">Invariant</text>
  <text x="1050" y="762" text-anchor="middle" class="small">relationships remain while routes, carriers and governance change</text>
</svg>
