<text x="1143" y="994" fill="#925000" font-family="Arial, sans-serif" font-size="25" font-weight="700">1</text>
<path d="M1177 985 L1233 985" stroke="#925000" stroke-width="3" stroke-dasharray="" fill="none"/>
<path d="M1219.0 978.0 L1233 985 L1219.0 992.0" stroke="#925000" stroke-width="3" fill="none"/>
