<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2400" viewBox="0 0 1800 2400"><title>PRP — Connection</title><desc>Select a service mode. Establish the channel. Exchange protected operations.</desc>
<rect x="0" y="0" width="1800" height="2400" rx="0" fill="white" stroke="none" stroke-width="2"/>
<rect x="72" y="70" width="8" height="212" rx="0" fill="white" stroke="#925000" stroke-width="2"/>
<text x="105" y="106" fill="#925000" font-family="Arial, sans-serif" font-size="24" font-weight="400">PRP / TECHNICAL ATLAS</text>
<text x="105" y="199" fill="#142b3d" font-family="Arial, sans-serif" font-size="78" font-weight="400">Connection</text>
<text x="108" y="258" fill="#40576a" font-family="Arial, sans-serif" font-size="28" font-weight="400">Select a service mode. Establish the channel. Exchange protected operations.</text>
<text x="1500" y="106" fill="#925000" font-family="Arial, sans-serif" font-size="23" font-weight="400">PLATE 02 / 04</text>
<path d="M72 322 L1728 322" stroke="#aab7c0" stroke-width="2" stroke-dasharray="" fill="none"/>
<text x="104" y="372" fill="#925000" font-family="Arial, sans-serif" font-size="24" font-weight="400">01</text>
<text x="178" y="373" fill="#142b3d" font-family="Arial, sans-serif" font-size="34" font-weight="700">HS2 — choose the identification model</text>
<text x="1250" y="373" fill="#40576a" font-family="Arial, sans-serif" font-size="23" font-weight="400">R = requester · S = service</text>
<text x="104" y="425" fill="#925000" font-family="Arial, sans-serif" font-size="26" font-weight="700">A / KNOWN DESTINATION</text>
<circle cx="149" cy="475" r="26" fill="white" stroke="#925000" stroke-width="3"/>
<text x="142" y="484" fill="#925000" font-family="Arial, sans-serif" font-size="25" font-weight="700">R</text>
<circle cx="544" cy="475" r="26" fill="white" stroke="#925000" stroke-width="3"/>
<text x="537" y="484" fill="#925000" font-family="Arial, sans-serif" font-size="25" font-weight="700">S</text>
<path d="M149 505 L149 620" stroke="#aab7c0" stroke-width="2" stroke-dasharray="5 6" fill="none"/>
<path d="M544 505 L544 620" stroke="#aab7c0" stroke-width="2" stroke-dasharray="5 6" fill="none"/>
<path d="M539 535 L154 535" stroke="#925000" stroke-width="3" stroke-dasharray="" fill="none"/>
<path d="M168.0 542.0 L154 535 L168.0 528.0" stroke="#925000" stroke-width="3" fill="none"/>
<text x="196" y="525" fill="#142b3d" font-family="Arial, sans-serif" font-size="22" font-weight="400">1  Expected identity proof</text>
<path d="M154 601 L539 601" stroke="#925000" stroke-width="3" stroke-dasharray="" fill="none"/>
<path d="M525.0 594.0 L539 601 L525.0 608.0" stroke="#925000" stroke-width="3" fill="none"/>
<text x="196" y="590" fill="#142b3d" font-family="Arial, sans-serif" font-size="22" font-weight="400">2  Requester identity proof</text>
<text x="104" y="654" fill="#40576a" font-family="Arial, sans-serif" font-size="24" font-weight="400">R knows the exact service SCIR.</text>
<text x="648" y="425" fill="#925000" font-family="Arial, sans-serif" font-size="26" font-weight="700">B / ALIAS SERVICE</text>
<circle cx="693" cy="475" r="26" fill="white" stroke="#925000" stroke-width="3"/>
<text x="686" y="484" fill="#925000" font-family="Arial, sans-serif" font-size="25" font-weight="700">R</text>
<circle cx="1088" cy="475" r="26" fill="white" stroke="#925000" stroke-width="3"/>
<text x="1081" y="484" fill="#925000" font-family="Arial, sans-serif" font-size="25" font-weight="700">S</text>
<path d="M693 505 L693 620" stroke="#aab7c0" stroke-width="2" stroke-dasharray="5 6" fill="none"/>
<path d="M1088 505 L1088 620" stroke="#aab7c0" stroke-width="2" stroke-dasharray="5 6" fill="none"/>
<path d="M698 535 L1083 535" stroke="#925000" stroke-width="3" stroke-dasharray="" fill="none"/>
<path d="M1069.0 528.0 L1083 535 L1069.0 542.0" stroke="#925000" stroke-width="3" fill="none"/>
<text x="743" y="525" fill="#142b3d" font-family="Arial, sans-serif" font-size="22" font-weight="400">1  Requester identifies</text>
<path d="M1083 601 L698 601" stroke="#925000" stroke-width="3" stroke-dasharray="" fill="none"/>
<path d="M712.0 608.0 L698 601 L712.0 594.0" stroke="#925000" stroke-width="3" fill="none"/>
<text x="743" y="590" fill="#142b3d" font-family="Arial, sans-serif" font-size="22" font-weight="400">2  Optional service identity</text>
<text x="648" y="654" fill="#40576a" font-family="Arial, sans-serif" font-size="24" font-weight="400">Identity disclosure inside the channel.</text>
<text x="1192" y="425" fill="#925000" font-family="Arial, sans-serif" font-size="26" font-weight="700">C / UNIDENTIFIED</text>
<circle cx="1237" cy="475" r="26" fill="white" stroke="#925000" stroke-width="3"/>
<text x="1230" y="484" fill="#925000" font-family="Arial, sans-serif" font-size="25" font-weight="700">R</text>
<circle cx="1632" cy="475" r="26" fill="white" stroke="#925000" stroke-width="3"/>
<text x="1625" y="484" fill="#925000" font-family="Arial, sans-serif" font-size="25" font-weight="700">S</text>
<path d="M1237 505 L1237 620" stroke="#aab7c0" stroke-width="2" stroke-dasharray="5 6" fill="none"/>
<path d="M1632 505 L1632 620" stroke="#aab7c0" stroke-width="2" stroke-dasharray="5 6" fill="none"/>
<path d="M1242 535 L1627 535" stroke="#925000" stroke-width="3" stroke-dasharray="" fill="none"/>
<path d="M1613.0 528.0 L1627 535 L1613.0 542.0" stroke="#925000" stroke-width="3" fill="none"/>
<path d="M1627 601 L1242 601" stroke="#925000" stroke-width="3" stroke-dasharray="" fill="none"/>
<path d="M1256.0 608.0 L1242 601 L1256.0 594.0" stroke="#925000" stroke-width="3" fill="none"/>
<text x="1307" y="570" fill="#142b3d" font-family="Arial, sans-serif" font-size="24" font-weight="400">Ephemeral channel</text>
<text x="1192" y="654" fill="#40576a" font-family="Arial, sans-serif" font-size="24" font-weight="400">No PRP identity proof on either side.</text>
<text x="104" y="703" fill="#40576a" font-family="Arial, sans-serif" font-size="26" font-weight="400">Identity proof and permission are separate: service policy decides which operations are allowed.</text>
<text x="104" y="744" fill="#40576a" font-family="Arial, sans-serif" font-size="26" font-weight="400">B/C initial key substitution remains a risk; later identity disclosure cannot undo earlier exposure.</text>
<path d="M72 812 L1728 812" stroke="#aab7c0" stroke-width="2" stroke-dasharray="" fill="none"/>
<text x="104" y="862" fill="#925000" font-family="Arial, sans-serif" font-size="24" font-weight="400">02</text>
<text x="178" y="863" fill="#142b3d" font-family="Arial, sans-serif" font-size="34" font-weight="700">Initial laboratory profiles / A1 · B1 · C1</text>
<text x="104" y="918" fill="#925000" font-family="Arial, sans-serif" font-size="35" font-weight="700">A1</text>
<text x="275" y="919" fill="#925000" font-family="Arial, sans-serif" font-size="23" font-weight="700">REQUESTER</text>
<text x="908" y="919" fill="#925000" font-family="Arial, sans-serif" font-size="23" font-weight="700">SERVICE</text>
<path d="M335 935 L335 1180" stroke="#aab7c0" stroke-width="2" stroke-dasharray="5 6" fill="none"/>
<path d="M965 935 L965 1180" stroke="#aab7c0" stroke-width="2" stroke-dasharray="5 6" fill="none"/>
