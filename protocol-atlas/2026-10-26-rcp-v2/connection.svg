<text x="410" y="944" fill="#142b3d" font-family="Arial, sans-serif" font-size="23" font-weight="400">M1 · Initiate</text>
<path d="M960 1002 L340 1002" stroke="#925000" stroke-width="3" stroke-dasharray="" fill="none"/>
<path d="M354.0 1009.0 L340 1002 L354.0 995.0" stroke="#925000" stroke-width="3" fill="none"/>
<text x="410" y="993" fill="#142b3d" font-family="Arial, sans-serif" font-size="23" font-weight="400">M2 · Service proof</text>
<path d="M340 1051 L960 1051" stroke="#925000" stroke-width="3" stroke-dasharray="" fill="none"/>
<path d="M946.0 1044.0 L960 1051 L946.0 1058.0" stroke="#925000" stroke-width="3" fill="none"/>
<text x="410" y="1042" fill="#142b3d" font-family="Arial, sans-serif" font-size="23" font-weight="400">M3 · Requester proof</text>
<path d="M960 1100 L340 1100" stroke="#925000" stroke-width="3" stroke-dasharray="" fill="none"/>
<path d="M354.0 1107.0 L340 1100 L354.0 1093.0" stroke="#925000" stroke-width="3" fill="none"/>
<text x="410" y="1091" fill="#142b3d" font-family="Arial, sans-serif" font-size="23" font-weight="400">M4 · ALLOW / DENY</text>
<path d="M340 1149 L960 1149" stroke="#925000" stroke-width="3" stroke-dasharray="" fill="none"/>
<path d="M946.0 1142.0 L960 1149 L946.0 1156.0" stroke="#925000" stroke-width="3" fill="none"/>
<text x="410" y="1140" fill="#142b3d" font-family="Arial, sans-serif" font-size="23" font-weight="400">On ALLOW: readiness + optional DATA</text>
<text x="1130" y="920" fill="#925000" font-family="Arial, sans-serif" font-size="30" font-weight="700">B1 / C1</text>
