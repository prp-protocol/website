<text x="108" y="258" fill="#40576a" font-family="Arial, sans-serif" font-size="28" font-weight="400">Separate reference formation, identity proof and protected-channel construction.</text>
<text x="1500" y="106" fill="#245b96" font-family="Arial, sans-serif" font-size="23" font-weight="400">REFERENCE / R1</text>
