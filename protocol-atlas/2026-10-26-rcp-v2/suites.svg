<text x="104" y="1847" fill="#40576a" font-family="Arial, sans-serif" font-size="24" font-weight="400">0101–0102: classical · 0201–0202: hybrid · 0301–0302: post-quantum key establishment.</text>
<text x="104" y="1887" fill="#40576a" font-family="Arial, sans-serif" font-size="24" font-weight="400">NONE has no encryption or AEAD tag. Protected rows: nonce 12 octets, tag 16 octets.</text>
<path d="M72 1920 L1728 1920" stroke="#aab7c0" stroke-width="2" stroke-dasharray="" fill="none"/>
<text x="104" y="1970" fill="#245b96" font-family="Arial, sans-serif" font-size="24" font-weight="400">04</text>
<text x="178" y="1971" fill="#142b3d" font-family="Arial, sans-serif" font-size="34" font-weight="700">Selected HS2 laboratory profiles / A1 · B1 · C1</text>
<text x="104" y="2016" fill="#40576a" font-family="Arial, sans-serif" font-size="24" font-weight="400">A1: identity suite 0x0002; Ristretto-based construction, BLAKE3 derivation, ChaCha20-Poly1305.</text>
<text x="104" y="2055" fill="#40576a" font-family="Arial, sans-serif" font-size="24" font-weight="400">B1/C1: Ristretto255 + HKDF/HMAC-SHA-256 + ChaCha20-Poly1305; B1 adds Ed25519ctx.</text>
<text x="104" y="2094" fill="#40576a" font-family="Arial, sans-serif" font-size="24" font-weight="400">C1 proves no identity. These profiles do not enable the full v4 inventory or select NONE.</text>
<rect x="72" y="2175" width="1656" height="110" rx="12" fill="white" stroke="#9babb6" stroke-width="2"/>
<text x="104" y="2218" fill="#245b96" font-family="Arial, sans-serif" font-size="28" font-weight="700">READ IDS WITH THEIR REGISTRY</text>
<text x="104" y="2260" fill="#142b3d" font-family="Arial, sans-serif" font-size="26" font-weight="400">Identity 0x0002 and session 0x0002 mean different things. Registry presence is not profile support.</text>
