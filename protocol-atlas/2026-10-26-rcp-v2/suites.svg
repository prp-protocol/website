<text x="104" y="1132" fill="#40576a" font-family="Arial, sans-serif" font-size="25" font-weight="400">SCIR envelope: header[1] + reference_suite[2] + identifier[L]. Current L: 32 or 48 octets.</text>
<text x="104" y="1172" fill="#40576a" font-family="Arial, sans-serif" font-size="25" font-weight="400">For ALIAS / MULTICAST / GROUPCAST, the reference suite does not select the external signer.</text>
