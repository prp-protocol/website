<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2400" viewBox="0 0 1800 2400"><title>PRP — Navigation</title><desc>Find a participant. Select a trajectory. Reach the intended context.</desc>
<rect x="0" y="0" width="1800" height="2400" rx="0" fill="white" stroke="none" stroke-width="2"/>
<rect x="72" y="70" width="8" height="212" rx="0" fill="white" stroke="#00796d" stroke-width="2"/>
<text x="105" y="106" fill="#00796d" font-family="Arial, sans-serif" font-size="24" font-weight="400">PRP / TECHNICAL ATLAS</text>
<text x="105" y="199" fill="#142b3d" font-family="Arial, sans-serif" font-size="78" font-weight="400">Navigation</text>
<text x="108" y="258" fill="#40576a" font-family="Arial, sans-serif" font-size="28" font-weight="400">Find a participant. Select a trajectory. Reach the intended context.</text>
<text x="1500" y="106" fill="#00796d" font-family="Arial, sans-serif" font-size="23" font-weight="400">PLATE 01 / 04</text>
<path d="M72 322 L1728 322" stroke="#aab7c0" stroke-width="2" stroke-dasharray="" fill="none"/>
<text x="104" y="372" fill="#00796d" font-family="Arial, sans-serif" font-size="24" font-weight="400">01</text>
<text x="178" y="373" fill="#142b3d" font-family="Arial, sans-serif" font-size="34" font-weight="700">Choose what to find</text>
<text x="104" y="425" fill="#00796d" font-family="Arial, sans-serif" font-size="29" font-weight="700">IDENTITY / SCIR</text>
<text x="638" y="425" fill="#00796d" font-family="Arial, sans-serif" font-size="29" font-weight="700">ALIAS</text>
<text x="1172" y="425" fill="#00796d" font-family="Arial, sans-serif" font-size="29" font-weight="700">SIMILARITY / LSH</text>
<rect x="108" y="458" width="150" height="58" rx="5" fill="white" stroke="#9babb6" stroke-width="2"/>
<text x="131" y="496" fill="#142b3d" font-family="Arial, sans-serif" font-size="28" font-weight="400">SCIR</text>
<path d="M268 487 L354 487" stroke="#00796d" stroke-width="3" stroke-dasharray="" fill="none"/>
<path d="M340.0 480.0 L354 487 L340.0 494.0" stroke="#00796d" stroke-width="3" fill="none"/>
<circle cx="390" cy="487" r="26" fill="white" stroke="#00796d" stroke-width="3"/>
<text x="383" y="496" fill="#00796d" font-family="Arial, sans-serif" font-size="25" font-weight="700">P</text>
<text x="104" y="565" fill="#40576a" font-family="Arial, sans-serif" font-size="25" font-weight="400">Exact participant reference.</text>
<text x="104" y="600" fill="#40576a" font-family="Arial, sans-serif" font-size="25" font-weight="400">Key control is proved on connection.</text>
<rect x="642" y="458" width="150" height="58" rx="5" fill="white" stroke="#9babb6" stroke-width="2"/>
<text x="657" y="496" fill="#142b3d" font-family="Arial, sans-serif" font-size="28" font-weight="400">ALIAS</text>
<path d="M802 487 L936 455" stroke="#00796d" stroke-width="3" stroke-dasharray="" fill="none"/>
<path d="M920.7569739900871 451.4432939310203 L936 455 L924.0088195388685 465.06039716654254" stroke="#00796d" stroke-width="3" fill="none"/>
<circle cx="960" cy="455" r="14" fill="white" stroke="#00796d" stroke-width="3"/>
<path d="M802 487 L936 492" stroke="#00796d" stroke-width="3" stroke-dasharray="" fill="none"/>
<path d="M922.2707482709611 484.48284315976576 L936 492 L921.7487234903892 498.4731072790906" stroke="#00796d" stroke-width="3" fill="none"/>
<circle cx="960" cy="492" r="14" fill="white" stroke="#00796d" stroke-width="3"/>
<path d="M802 487 L936 529" stroke="#00796d" stroke-width="3" stroke-dasharray="" fill="none"/>
<path d="M924.7344338027589 518.133214907086 L936 529 L920.5472322073241 531.4923819020445" stroke="#00796d" stroke-width="3" fill="none"/>
<circle cx="960" cy="529" r="14" fill="white" stroke="#00796d" stroke-width="3"/>
<text x="638" y="581" fill="#40576a" font-family="Arial, sans-serif" font-size="25" font-weight="400">One reference; independent participants.</text>
<circle cx="1210" cy="487" r="5" fill="white" stroke="#00796d" stroke-width="3"/>
<circle cx="1240" cy="469" r="5" fill="white" stroke="#00796d" stroke-width="3"/>
<circle cx="1229" cy="511" r="5" fill="white" stroke="#00796d" stroke-width="3"/>
<circle cx="1267" cy="499" r="5" fill="white" stroke="#00796d" stroke-width="3"/>
<circle cx="1275" cy="467" r="5" fill="white" stroke="#00796d" stroke-width="3"/>
<path d="M1310 488 L1410 488" stroke="#00796d" stroke-width="3" stroke-dasharray="" fill="none"/>
<path d="M1396.0 481.0 L1410 488 L1396.0 495.0" stroke="#00796d" stroke-width="3" fill="none"/>
<circle cx="1450" cy="488" r="5" fill="white" stroke="#00796d" stroke-width="3"/>
<circle cx="1475" cy="471" r="5" fill="white" stroke="#00796d" stroke-width="3"/>
<circle cx="1483" cy="510" r="5" fill="white" stroke="#00796d" stroke-width="3"/>
<circle cx="1505" cy="490" r="5" fill="white" stroke="#00796d" stroke-width="3"/>
<text x="1172" y="565" fill="#40576a" font-family="Arial, sans-serif" font-size="25" font-weight="400">Similarity finds candidates.</text>
<text x="1172" y="600" fill="#40576a" font-family="Arial, sans-serif" font-size="25" font-weight="400">The application checks the match.</text>
<text x="104" y="642" fill="#40576a" font-family="Arial, sans-serif" font-size="24" font-weight="400">SCIR also defines MULTICAST and GROUPCAST reference classes.</text>
<path d="M72 682 L1728 682" stroke="#aab7c0" stroke-width="2" stroke-dasharray="" fill="none"/>
<text x="104" y="732" fill="#00796d" font-family="Arial, sans-serif" font-size="24" font-weight="400">02</text>
<text x="178" y="733" fill="#142b3d" font-family="Arial, sans-serif" font-size="34" font-weight="700">Discover candidate directions</text>
<rect x="104" y="787" width="370" height="175" rx="12" fill="white" stroke="#9babb6" stroke-width="2"/>
<text x="122" y="830" fill="#00796d" font-family="Arial, sans-serif" font-size="23" font-weight="700">LOCAL BEACON</text>
<text x="122" y="880" fill="#40576a" font-family="Arial, sans-serif" font-size="24" font-weight="400">Find an adjacent</text>
<text x="122" y="914" fill="#40576a" font-family="Arial, sans-serif" font-size="24" font-weight="400">aggregator on a carrier.</text>
<path d="M478 871 L507 871" stroke="#00796d" stroke-width="3" stroke-dasharray="" fill="none"/>
<path d="M493.0 864.0 L507 871 L493.0 878.0" stroke="#00796d" stroke-width="3" fill="none"/>
<rect x="513" y="787" width="370" height="175" rx="12" fill="white" stroke="#9babb6" stroke-width="2"/>
<text x="531" y="830" fill="#00796d" font-family="Arial, sans-serif" font-size="23" font-weight="700">PROTECTED DISCOVERY</text>
<text x="531" y="880" fill="#40576a" font-family="Arial, sans-serif" font-size="24" font-weight="400">Establish the selected</text>
<text x="531" y="914" fill="#40576a" font-family="Arial, sans-serif" font-size="24" font-weight="400">discovery relationship.</text>
<path d="M887 871 L916 871" stroke="#00796d" stroke-width="3" stroke-dasharray="" fill="none"/>
<path d="M902.0 864.0 L916 871 L902.0 878.0" stroke="#00796d" stroke-width="3" fill="none"/>
<rect x="922" y="787" width="370" height="175" rx="12" fill="white" stroke="#9babb6" stroke-width="2"/>
<text x="940" y="830" fill="#00796d" font-family="Arial, sans-serif" font-size="23" font-weight="700">BLOOM VIEWS</text>
<text x="940" y="880" fill="#40576a" font-family="Arial, sans-serif" font-size="24" font-weight="400">Test candidate directions;</text>
<text x="940" y="914" fill="#40576a" font-family="Arial, sans-serif" font-size="24" font-weight="400">rank and explore them.</text>
<path d="M1296 871 L1325 871" stroke="#00796d" stroke-width="3" stroke-dasharray="" fill="none"/>
<path d="M1311.0 864.0 L1325 871 L1311.0 878.0" stroke="#00796d" stroke-width="3" fill="none"/>
<rect x="1331" y="787" width="370" height="175" rx="12" fill="white" stroke="#9babb6" stroke-width="2"/>
<text x="1349" y="830" fill="#00796d" font-family="Arial, sans-serif" font-size="23" font-weight="700">TARGET CHECK</text>
<text x="1349" y="880" fill="#40576a" font-family="Arial, sans-serif" font-size="24" font-weight="400">Resolve the candidate</text>
<text x="1349" y="914" fill="#40576a" font-family="Arial, sans-serif" font-size="24" font-weight="400">and verify the target.</text>
<text x="104" y="1017" fill="#40576a" font-family="Arial, sans-serif" font-size="27" font-weight="400">One unified directional Bloom view can contain admitted identity, ALIAS and LSH indices.</text>
<text x="104" y="1060" fill="#40576a" font-family="Arial, sans-serif" font-size="27" font-weight="400">A positive selects a candidate direction; exact matching and proof follow.</text>
<path d="M72 1142 L1728 1142" stroke="#aab7c0" stroke-width="2" stroke-dasharray="" fill="none"/>
<text x="104" y="1192" fill="#00796d" font-family="Arial, sans-serif" font-size="24" font-weight="400">03</text>
<text x="178" y="1193" fill="#142b3d" font-family="Arial, sans-serif" font-size="34" font-weight="700">Build a relative topological path</text>
<text x="104" y="1250" fill="#00796d" font-family="Arial, sans-serif" font-size="53" font-weight="700">TPA</text>
<text x="270" y="1245" fill="#142b3d" font-family="Arial, sans-serif" font-size="45" font-weight="400">7:2/3:8/1a:ff</text>
<text x="104" y="1302" fill="#40576a" font-family="Arial, sans-serif" font-size="28" font-weight="400">Each pair selects interface:slot in the context reached by the previous pair.</text>
<circle cx="200" cy="1400" r="32" fill="white" stroke="#00796d" stroke-width="3"/>
<text x="193" y="1409" fill="#00796d" font-family="Arial, sans-serif" font-size="25" font-weight="700">O</text>
<text x="130" y="1350" fill="#00796d" font-family="Arial, sans-serif" font-size="23" font-weight="700">ORIGIN</text>
<circle cx="650" cy="1400" r="32" fill="white" stroke="#00796d" stroke-width="3"/>
<text x="643" y="1409" fill="#00796d" font-family="Arial, sans-serif" font-size="25" font-weight="700">1</text>
<text x="580" y="1350" fill="#00796d" font-family="Arial, sans-serif" font-size="23" font-weight="700">CONTEXT 1</text>
<circle cx="1100" cy="1400" r="32" fill="white" stroke="#00796d" stroke-width="3"/>
<text x="1093" y="1409" fill="#00796d" font-family="Arial, sans-serif" font-size="25" font-weight="700">2</text>
<text x="1030" y="1350" fill="#00796d" font-family="Arial, sans-serif" font-size="23" font-weight="700">CONTEXT 2</text>
<circle cx="1550" cy="1400" r="32" fill="white" stroke="#00796d" stroke-width="3"/>
<text x="1543" y="1409" fill="#00796d" font-family="Arial, sans-serif" font-size="25" font-weight="700">D</text>
<text x="1480" y="1350" fill="#00796d" font-family="Arial, sans-serif" font-size="23" font-weight="700">DESTINATION</text>
<path d="M236 1400 L610 1400" stroke="#00796d" stroke-width="3" stroke-dasharray="" fill="none"/>
<path d="M596.0 1393.0 L610 1400 L596.0 1407.0" stroke="#00796d" stroke-width="3" fill="none"/>
<text x="380" y="1380" fill="#00796d" font-family="Arial, sans-serif" font-size="28" font-weight="400">7:2</text>
<path d="M686 1400 L1060 1400" stroke="#00796d" stroke-width="3" stroke-dasharray="" fill="none"/>
<path d="M1046.0 1393.0 L1060 1400 L1046.0 1407.0" stroke="#00796d" stroke-width="3" fill="none"/>
<text x="830" y="1380" fill="#00796d" font-family="Arial, sans-serif" font-size="28" font-weight="400">3:8</text>
<path d="M1136 1400 L1510 1400" stroke="#00796d" stroke-width="3" stroke-dasharray="" fill="none"/>
<path d="M1496.0 1393.0 L1510 1400 L1496.0 1407.0" stroke="#00796d" stroke-width="3" fill="none"/>
<text x="1280" y="1380" fill="#00796d" font-family="Arial, sans-serif" font-size="28" font-weight="400">1a:ff</text>
<path d="M223 1425 L650 1500" stroke="#00796d" stroke-width="2" stroke-dasharray="8 8" fill="none"/>
<path d="M650 1500 L1100 1500" stroke="#00796d" stroke-width="2" stroke-dasharray="8 8" fill="none"/>
<path d="M1100 1500 L1524 1425" stroke="#00796d" stroke-width="2" stroke-dasharray="8 8" fill="none"/>
<circle cx="650" cy="1500" r="18" fill="white" stroke="#00796d" stroke-width="3"/>
<circle cx="1100" cy="1500" r="18" fill="white" stroke="#00796d" stroke-width="3"/>
<text x="700" y="1468" fill="#40576a" font-family="Arial, sans-serif" font-size="24" font-weight="400">Alternative selected trajectory</text>
<text x="1320" y="1548" fill="#00796d" font-family="Arial, sans-serif" font-size="25" font-weight="400">One destination identity</text>
<text x="104" y="1598" fill="#40576a" font-family="Arial, sans-serif" font-size="26" font-weight="400">Client-selected paths · local interface:slot selectors · receiver-local ingress</text>
<text x="104" y="1635" fill="#40576a" font-family="Arial, sans-serif" font-size="26" font-weight="400">Several paths may reach one identity. Cached contexts must match their incarnation.</text>
<path d="M72 1692 L1728 1692" stroke="#aab7c0" stroke-width="2" stroke-dasharray="" fill="none"/>
<text x="104" y="1742" fill="#00796d" font-family="Arial, sans-serif" font-size="24" font-weight="400">04</text>
<text x="178" y="1743" fill="#142b3d" font-family="Arial, sans-serif" font-size="34" font-weight="700">Read the representation</text>
<text x="104" y="1796" fill="#00796d" font-family="Arial, sans-serif" font-size="25" font-weight="700">SCIR / CANONICAL BINARY REFERENCE</text>
<rect x="104" y="1820" width="390" height="105" rx="9" fill="white" stroke="#9babb6" stroke-width="2"/>
<text x="122" y="1857" fill="#142b3d" font-family="Arial, sans-serif" font-size="25" font-weight="700">reference_header</text>
<text x="122" y="1898" fill="#00796d" font-family="Arial, sans-serif" font-size="23" font-weight="400">1 octet · class in low 2 bits</text>
<rect x="506" y="1820" width="470" height="105" rx="9" fill="white" stroke="#9babb6" stroke-width="2"/>
<text x="524" y="1857" fill="#142b3d" font-family="Arial, sans-serif" font-size="25" font-weight="700">reference_suite</text>
<text x="524" y="1898" fill="#00796d" font-family="Arial, sans-serif" font-size="23" font-weight="400">2 octets · unsigned big-endian</text>
<rect x="988" y="1820" width="712" height="105" rx="9" fill="white" stroke="#9babb6" stroke-width="2"/>
<text x="1006" y="1857" fill="#142b3d" font-family="Arial, sans-serif" font-size="25" font-weight="700">identifier</text>
<text x="1006" y="1898" fill="#00796d" font-family="Arial, sans-serif" font-size="23" font-weight="400">L octets · length defined by the suite</text>
<text x="104" y="1980" fill="#40576a" font-family="Arial, sans-serif" font-size="27" font-weight="400">TPA text uses lowercase hexadecimal interface:slot pairs separated by “/”.</text>
<text x="104" y="2023" fill="#40576a" font-family="Arial, sans-serif" font-size="27" font-weight="400">It contains at least one pair. Local zero-hop use is a separate API operation.</text>
<text x="104" y="2066" fill="#40576a" font-family="Arial, sans-serif" font-size="27" font-weight="400">TPA text describes a path; the selected realization supplies its transport encoding.</text>
<rect x="72" y="2175" width="1656" height="110" rx="12" fill="white" stroke="#9babb6" stroke-width="2"/>
<text x="104" y="2218" fill="#00796d" font-family="Arial, sans-serif" font-size="28" font-weight="700">CONTINUE WITH THE CONNECTION ATLAS</text>
<text x="104" y="2260" fill="#142b3d" font-family="Arial, sans-serif" font-size="26" font-weight="400">Discovery uses protected connections; a selected path supports the next connection attempt.</text>
<text x="72" y="2335" fill="#40576a" font-family="Arial, sans-serif" font-size="22" font-weight="400">Working-draft architecture · 26 October 2026 · Editorial revision 2</text>
<text x="1390" y="2335" fill="#142b3d" font-family="Arial, sans-serif" font-size="28" font-weight="700">prp-protocol.org</text>
</svg>